<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bladeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#090d1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boneColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="fireEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <!-- Aura Glow -->
  <circle cx="60" cy="60" r="50" fill="url(#bladeGlow)"/>

  <!-- Bone Blade Spine & Edge (Diagonal broadsword with jagged serrated bone teeth) -->
  <g transform="rotate(-30 60 60)">
    <!-- Hilt & Guard -->
    <rect x="57" y="90" width="6" height="24" rx="2" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="60" cy="116" r="4" fill="#b45309" stroke="#fbbf24" stroke-width="1.2"/>
    
    <!-- Crossguard with Draconic Horns -->
    <path d="M 40 88 C 50 86, 70 86, 80 88 L 74 94 L 46 94 Z" fill="url(#boneColor)" stroke="#f59e0b" stroke-width="1.5"/>
    <polygon points="40,88 32,84 42,92" fill="#ea580c"/>
    <polygon points="80,88 88,84 78,92" fill="#ea580c"/>

    <!-- Central Blood Gem on Crossguard -->
    <polygon points="60,86 64,90 60,94 56,90" fill="#dc2626" stroke="#fef08a" stroke-width="1"/>

    <!-- Main Blade Spine (Heavy serrated bone sword) -->
    <path d="M 54 88 L 52 25 L 60 8 L 68 25 L 66 88 Z" fill="url(#boneColor)" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Left Serrated Teeth -->
    <polygon points="52,70 42,64 52,58" fill="url(#fireEdge)"/>
    <polygon points="52,50 40,44 52,38" fill="url(#fireEdge)"/>
    
    <!-- Right Serrated Teeth -->
    <polygon points="68,70 78,64 68,58" fill="url(#fireEdge)"/>
    <polygon points="68,50 80,44 68,38" fill="url(#fireEdge)"/>

    <!-- Glowing Fuller / Core Runes -->
    <line x1="60" y1="84" x2="60" y2="18" stroke="#fef08a" stroke-width="2"/>
    <line x1="60" y1="84" x2="60" y2="18" stroke="#f97316" stroke-width="4" opacity="0.4"/>
  </g>
</svg>
