<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="platinaGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#090d1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="staffMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="magicViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="60%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <filter id="staffFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="60" cy="50" r="48" fill="url(#platinaGlow)"/>

  <g filter="url(#staffFilter)">
    <!-- Staff Shaft (Diagonal) -->
    <line x1="85" y1="105" x2="45" y2="40" stroke="url(#staffMetal)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="85" y1="105" x2="45" y2="40" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="8 6"/>

    <!-- Bottom Pommel Point -->
    <polygon points="85,103 89,112 80,107" fill="url(#staffMetal)" stroke="#9333ea" stroke-width="1"/>

    <!-- Crescent Head Blades (Platina Staff distinctive design) -->
    <!-- Left Crescent Horn -->
    <path d="M 45 40 C 28 32, 22 14, 40 10 C 35 22, 42 32, 45 40 Z" fill="url(#staffMetal)" stroke="#c084fc" stroke-width="1.5"/>
    <!-- Right Crescent Wing Blade -->
    <path d="M 45 40 C 62 32, 68 14, 50 10 C 55 22, 48 32, 45 40 Z" fill="url(#staffMetal)" stroke="#c084fc" stroke-width="1.5"/>

    <!-- Outer Arc Ring -->
    <path d="M 32 18 Q 45 6 58 18" fill="none" stroke="#e879f9" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Central Glowing Arcane Orb -->
    <circle cx="45" cy="24" r="8" fill="url(#magicViolet)" stroke="#fdf4ff" stroke-width="1.5"/>
    <circle cx="43" cy="22" r="2.5" fill="#ffffff" opacity="0.9"/>

    <!-- Wand Energy Rings -->
    <ellipse cx="45" cy="44" rx="7" ry="2" fill="url(#staffMetal)" stroke="#a855f7" stroke-width="1"/>
    <ellipse cx="53" cy="56" rx="5" ry="1.5" fill="url(#staffMetal)" stroke="#a855f7" stroke-width="1"/>
    <ellipse cx="65" cy="74" rx="5" ry="1.5" fill="url(#staffMetal)" stroke="#a855f7" stroke-width="1"/>

    <!-- Magic Sparkles -->
    <polygon points="45,6 47,10 51,11 47,13 45,17 43,13 39,11 43,10" fill="#f5d0fe"/>
    <polygon points="26,14 27,17 30,17 28,19 28,22 26,20 23,21 25,18" fill="#c084fc"/>
    <polygon points="64,14 65,17 68,17 66,19 66,22 64,20 61,21 63,18" fill="#c084fc"/>
  </g>
</svg>
